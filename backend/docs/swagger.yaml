basePath: /
definitions:
  app_internal_errs.ErrorResponse:
    properties:
      details:
        additionalProperties: true
        type: object
      error_key:
        type: string
      message:
        type: string
      status:
        type: integer
      timestamp:
        type: string
    required:
    - error_key
    - status
    type: object
  app_internal_errs.ValidationErrorResponse:
    properties:
      error_key:
        type: string
      errors:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      message:
        type: string
    required:
    - error_key
    - errors
    - message
    type: object
  app_internal_storages.Kind:
    enum:
    - local
    - s3
    - gcs
    type: string
    x-enum-varnames:
    - KindLocal
    - KindS3
    - KindGCS
  internal.MessageData:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  internal.MessageResponse:
    properties:
      data:
        $ref: '#/definitions/internal.MessageData'
    required:
    - data
    type: object
  internal.PaginationMeta:
    properties:
      current_page:
        type: integer
      last_page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    required:
    - current_page
    - last_page
    - per_page
    - total
    type: object
  internal_auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_auth.LoginDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_auth.LoginResponse'
    required:
    - data
    type: object
  internal_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_auth.UserResponse'
    required:
    - access_token
    - refresh_token
    - user
    type: object
  internal_auth.RefreshTokenDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_auth.RefreshTokenResponse'
    required:
    - data
    type: object
  internal_auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_auth.RefreshTokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    required:
    - access_token
    - refresh_token
    type: object
  internal_auth.RegisterDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_auth.RegisterResponse'
    required:
    - data
    type: object
  internal_auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  internal_auth.RegisterResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_auth.UserResponse'
    required:
    - access_token
    - refresh_token
    - user
    type: object
  internal_auth.ResetPasswordRequest:
    properties:
      password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  internal_auth.UpdatePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  internal_auth.UpdateProfileRequest:
    properties:
      email:
        type: string
      name:
        type: string
    required:
    - email
    - name
    type: object
  internal_auth.UserDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_auth.UserResponse'
    required:
    - data
    type: object
  internal_auth.UserResponse:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: integer
      name:
        type: string
      roles:
        items:
          type: string
        type: array
    required:
    - email
    - email_verified
    - id
    - name
    - roles
    type: object
  internal_auth.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  internal_plans.FilesConfig:
    properties:
      excludes:
        items:
          type: string
        type: array
      paths:
        items:
          type: string
        type: array
    required:
    - excludes
    - paths
    type: object
  internal_plans.FilesInput:
    properties:
      excludes:
        items:
          type: string
        type: array
      paths:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - paths
    type: object
  internal_plans.MySQLConfig:
    properties:
      database:
        type: string
      host:
        type: string
      port:
        type: integer
      user:
        type: string
    required:
    - database
    - host
    - port
    - user
    type: object
  internal_plans.MySQLInput:
    properties:
      database:
        maxLength: 255
        type: string
      host:
        maxLength: 255
        type: string
      password:
        type: string
      port:
        maximum: 65535
        minimum: 1
        type: integer
      user:
        maxLength: 255
        type: string
    required:
    - database
    - host
    - user
    type: object
  internal_plans.PaginatedPlansResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_plans.PlanResponse'
        type: array
      pagination:
        $ref: '#/definitions/internal.PaginationMeta'
    required:
    - data
    - pagination
    type: object
  internal_plans.PlanDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_plans.PlanResponse'
    required:
    - data
    type: object
  internal_plans.PlanRequest:
    properties:
      enabled:
        type: boolean
      files:
        $ref: '#/definitions/internal_plans.FilesInput'
      keep_monthly:
        maximum: 240
        minimum: 0
        type: integer
      keep_weekly:
        maximum: 520
        minimum: 0
        type: integer
      max_age_days:
        maximum: 3650
        minimum: 0
        type: integer
      mysql:
        $ref: '#/definitions/internal_plans.MySQLInput'
      name:
        maxLength: 100
        type: string
      postgres:
        $ref: '#/definitions/internal_plans.PostgresInput'
      schedules:
        items:
          $ref: '#/definitions/internal_plans.ScheduleInput'
        type: array
      source_kind:
        allOf:
        - $ref: '#/definitions/internal_plans.SourceKind'
        enum:
        - postgres
        - mysql
        - sqlite
        - files
      sqlite:
        $ref: '#/definitions/internal_plans.SQLiteInput'
      storage_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - enabled
    - keep_monthly
    - keep_weekly
    - max_age_days
    - name
    - schedules
    - source_kind
    - storage_ids
    type: object
  internal_plans.PlanResponse:
    properties:
      created_at:
        type: string
      enabled:
        type: boolean
      files:
        $ref: '#/definitions/internal_plans.FilesConfig'
      id:
        type: integer
      keep_monthly:
        type: integer
      keep_weekly:
        type: integer
      max_age_days:
        type: integer
      mysql:
        $ref: '#/definitions/internal_plans.MySQLConfig'
      name:
        type: string
      next_run_at:
        type: string
        x-nullable: true
      postgres:
        $ref: '#/definitions/internal_plans.PostgresConfig'
      schedules:
        items:
          $ref: '#/definitions/internal_plans.Schedule'
        type: array
      secret_set:
        type: boolean
      source_kind:
        allOf:
        - $ref: '#/definitions/internal_plans.SourceKind'
        enum:
        - postgres
        - mysql
        - sqlite
        - files
      sqlite:
        $ref: '#/definitions/internal_plans.SQLiteConfig'
      storages:
        items:
          $ref: '#/definitions/internal_plans.PlanStorageResponse'
        type: array
      updated_at:
        type: string
    required:
    - created_at
    - enabled
    - id
    - keep_monthly
    - keep_weekly
    - max_age_days
    - name
    - next_run_at
    - schedules
    - secret_set
    - source_kind
    - storages
    - updated_at
    type: object
  internal_plans.PlanStorageResponse:
    properties:
      id:
        type: integer
      kind:
        allOf:
        - $ref: '#/definitions/app_internal_storages.Kind'
        enum:
        - local
        - s3
        - gcs
      name:
        type: string
    required:
    - id
    - kind
    - name
    type: object
  internal_plans.PostgresConfig:
    properties:
      database:
        type: string
      host:
        type: string
      port:
        type: integer
      ssl_mode:
        enum:
        - disable
        - require
        - verify-full
        type: string
      user:
        type: string
    required:
    - database
    - host
    - port
    - ssl_mode
    - user
    type: object
  internal_plans.PostgresInput:
    properties:
      database:
        maxLength: 255
        type: string
      host:
        maxLength: 255
        type: string
      password:
        type: string
      port:
        maximum: 65535
        minimum: 1
        type: integer
      ssl_mode:
        enum:
        - disable
        - require
        - verify-full
        type: string
      user:
        maxLength: 255
        type: string
    required:
    - database
    - host
    - user
    type: object
  internal_plans.SQLiteConfig:
    properties:
      path:
        type: string
    required:
    - path
    type: object
  internal_plans.SQLiteInput:
    properties:
      path:
        type: string
    required:
    - path
    type: object
  internal_plans.Schedule:
    properties:
      days:
        items:
          $ref: '#/definitions/internal_plans.Weekday'
          enum:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
        type: array
      time:
        type: string
    required:
    - days
    - time
    type: object
  internal_plans.ScheduleInput:
    properties:
      days:
        items:
          enum:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
          type: string
        type: array
      time:
        type: string
    required:
    - days
    - time
    type: object
  internal_plans.SourceKind:
    enum:
    - postgres
    - mysql
    - sqlite
    - files
    type: string
    x-enum-varnames:
    - SourcePostgres
    - SourceMySQL
    - SourceSQLite
    - SourceFiles
  internal_plans.SourceRequest:
    properties:
      files:
        $ref: '#/definitions/internal_plans.FilesInput'
      mysql:
        $ref: '#/definitions/internal_plans.MySQLInput'
      postgres:
        $ref: '#/definitions/internal_plans.PostgresInput'
      source_kind:
        allOf:
        - $ref: '#/definitions/internal_plans.SourceKind'
        enum:
        - postgres
        - mysql
        - sqlite
        - files
      sqlite:
        $ref: '#/definitions/internal_plans.SQLiteInput'
    required:
    - source_kind
    type: object
  internal_plans.SourceTestDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_plans.SourceTestResponse'
    required:
    - data
    type: object
  internal_plans.SourceTestResponse:
    properties:
      error:
        type: string
      ok:
        type: boolean
      server_version:
        type: string
      step:
        enum:
        - connect
        - tool
        - path
        type: string
      tool:
        $ref: '#/definitions/internal_plans.ToolResponse'
    required:
    - ok
    type: object
  internal_plans.ToolResponse:
    properties:
      found:
        type: boolean
      name:
        type: string
      version:
        type: string
    required:
    - found
    - name
    type: object
  internal_plans.Weekday:
    enum:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
    type: string
    x-enum-varnames:
    - Monday
    - Tuesday
    - Wednesday
    - Thursday
    - Friday
    - Saturday
    - Sunday
  internal_storages.GCSConfig:
    properties:
      bucket:
        type: string
      prefix:
        type: string
    required:
    - bucket
    - prefix
    type: object
  internal_storages.GCSInput:
    properties:
      bucket:
        type: string
      credentials_json:
        type: string
      prefix:
        type: string
    required:
    - bucket
    type: object
  internal_storages.Kind:
    enum:
    - local
    - s3
    - gcs
    type: string
    x-enum-varnames:
    - KindLocal
    - KindS3
    - KindGCS
  internal_storages.LocalConfig:
    properties:
      path:
        type: string
    required:
    - path
    type: object
  internal_storages.LocalInput:
    properties:
      path:
        type: string
    required:
    - path
    type: object
  internal_storages.ObjectResponse:
    properties:
      is_dir:
        type: boolean
      modified_at:
        type: string
      name:
        type: string
      size:
        type: integer
    required:
    - is_dir
    - name
    - size
    type: object
  internal_storages.ObjectsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_storages.ObjectResponse'
        type: array
    required:
    - data
    type: object
  internal_storages.PaginatedStoragesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_storages.StorageResponse'
        type: array
      pagination:
        $ref: '#/definitions/internal.PaginationMeta'
    required:
    - data
    - pagination
    type: object
  internal_storages.S3Config:
    properties:
      bucket:
        type: string
      endpoint:
        type: string
      prefix:
        type: string
      region:
        type: string
      use_path_style:
        type: boolean
    required:
    - bucket
    - endpoint
    - prefix
    - region
    - use_path_style
    type: object
  internal_storages.S3Input:
    properties:
      access_key_id:
        type: string
      bucket:
        type: string
      endpoint:
        type: string
      prefix:
        type: string
      region:
        type: string
      secret_access_key:
        type: string
      use_path_style:
        type: boolean
    required:
    - bucket
    type: object
  internal_storages.StorageDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_storages.StorageResponse'
    required:
    - data
    type: object
  internal_storages.StorageRequest:
    properties:
      gcs:
        $ref: '#/definitions/internal_storages.GCSInput'
      kind:
        allOf:
        - $ref: '#/definitions/internal_storages.Kind'
        enum:
        - local
        - s3
        - gcs
      local:
        $ref: '#/definitions/internal_storages.LocalInput'
      name:
        maxLength: 100
        type: string
      s3:
        $ref: '#/definitions/internal_storages.S3Input'
    required:
    - kind
    - name
    type: object
  internal_storages.StorageResponse:
    properties:
      created_at:
        type: string
      gcs:
        $ref: '#/definitions/internal_storages.GCSConfig'
      id:
        type: integer
      kind:
        allOf:
        - $ref: '#/definitions/internal_storages.Kind'
        enum:
        - local
        - s3
        - gcs
      local:
        $ref: '#/definitions/internal_storages.LocalConfig'
      name:
        type: string
      s3:
        $ref: '#/definitions/internal_storages.S3Config'
      secret_set:
        type: boolean
      updated_at:
        type: string
    required:
    - created_at
    - id
    - kind
    - name
    - secret_set
    - updated_at
    type: object
  internal_storages.TestResultDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_storages.TestResultResponse'
    required:
    - data
    type: object
  internal_storages.TestResultResponse:
    properties:
      error:
        type: string
      ok:
        type: boolean
      step:
        enum:
        - connect
        - write
        - read
        - delete
        type: string
    required:
    - ok
    type: object
  internal_users.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
      role:
        enum:
        - super-admin
        - admin
        - user
        type: string
    required:
    - email
    - name
    - password
    - role
    type: object
  internal_users.PaginatedUsersResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_users.UserResponse'
        type: array
      pagination:
        $ref: '#/definitions/internal.PaginationMeta'
    required:
    - data
    - pagination
    type: object
  internal_users.SetPasswordRequest:
    properties:
      password:
        minLength: 8
        type: string
    required:
    - password
    type: object
  internal_users.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
    required:
    - email
    - name
    type: object
  internal_users.UserDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_users.UserResponse'
    required:
    - data
    type: object
  internal_users.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: integer
      name:
        type: string
      roles:
        items:
          type: string
        type: array
      updated_at:
        type: string
    required:
    - created_at
    - email
    - email_verified
    - id
    - name
    - roles
    - updated_at
    type: object
host: localhost:8181
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 'Gogobackup: storages, backup plans and the accounts that manage them'
  license:
    name: WTFPL
    url: http://www.wtfpl.net/
  termsOfService: http://swagger.io/terms/
  title: Gogo API Template
  version: "1.0"
paths:
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Emails a single-use reset link when the address belongs to an account.
        Always answers 200, so it does not reveal which emails are registered.
      parameters:
      - description: Account email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Request a password reset
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.LoginDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Logout the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /api/v1/auth/me:
    get:
      consumes:
      - application/json
      description: Get information about the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.UserDataResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user info
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Update name and email for the currently authenticated user
      parameters:
      - description: Profile update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.UserDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - auth
  /api/v1/auth/me/password:
    put:
      consumes:
      - application/json
      description: Change password for the currently authenticated user. Revokes all
        refresh tokens.
      parameters:
      - description: Password change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change current user password
      tags:
      - auth
  /api/v1/auth/me/verify-email:
    post:
      consumes:
      - application/json
      description: Sends a new verification link to the current user's email address
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.MessageResponse'
